# Alembic migration environment config
# Generic single-database configuration file.

[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of slug in auto-generated filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# even if autogenerate is not requested
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without corresponding .py files
sourceless = false

# version_locations is omitted — Alembic finds versions/ inside script_location automatically

# The output encoding used when revision files are written
output_encoding = utf-8

# Database URL — overridden at runtime by migrations/env.py from the DATABASE_URL env var.
# This placeholder prevents alembic from failing when the ini is parsed before env.py runs.
sqlalchemy.url = postgresql://placeholder:placeholder@localhost/placeholder


[post_write_hooks]
# Uncomment to auto-format generated migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
